<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/circleImage.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shivam Gupta — Full Stack Developer specializing in React, Node.js, and modern web technologies. Available for freelance and full-time opportunities." />
    <meta name="author" content="Shivam Gupta" />
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme before first paint so there is no flash
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          var stored = localStorage.getItem("portfolio-theme");
          if (stored === "dark" || stored === "light") dark = stored === "dark";
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <meta property="og:title" content="Shivam Gupta — Full Stack Developer" />
    <meta property="og:description" content="Building elegant, performant web experiences with modern technologies." />
    <meta property="og:type" content="website" />
    <title>Shivam Gupta — Full Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
